name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Check full formalization and axiom audit
        run: lake env lean Annular_Counterexamples_and_Skew-Shape_Block_Identities.lean
