name: Verify Lean formalization
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Verify complete cumulative proof
        run: bash scripts/verify.sh
